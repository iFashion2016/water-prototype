.sideMetric{
  min-width:0;

  flex-direction:column;
  justify-content:center;

  border-top:1px solid var(--line);

/* 保留文字层级，不再依赖彩色边框区分 */
.sideMetric.usage,
.sideMetric.readtime{
  background:#fff;

.overviewLabel,
.sideMetricLabel{
  color:var(--muted);
}

.balanceAmount,
.sideMetricValue{
  color:var(--navy);
}


/* ===== 首页账户卡片重新设计版 ===== */

/* 顶部账户信息 */
.accountTop{
  padding:15px 16px 13px;
  background:#fff;
}
.accountTitleRow{
  align-items:center;
}
.accountName{
  font-size:17px;
  font-weight:800;
  color:var(--text);
}
.accountNo{
  margin-top:3px;
  font-size:11px;
  color:var(--muted);
}
.address{
  margin-top:9px;
  font-size:12px;
  color:var(--text2);
  line-height:1.4;
}
.switchTag{
  background:#edf4ff;
  color:var(--brand);
  border:0;
  border-radius:999px;
  padding:7px 10px;
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
}

/* 数据主体：余额独占一整行，次要信息放在底部双栏 */
.accountDataClean{
  border-top:1px solid var(--line);
  background:#fff;
}

.balanceHeroClean{
  padding:17px 17px 15px;
  position:relative;
}

.balanceHeroTop{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.balanceHeroLabel{
  display:flex;
  align-items:center;
  gap:5px;
  font-size:11px;
  color:var(--muted);
}

.balanceHeroStatus{
  display:inline-flex;
  align-items:center;
  height:22px;
  padding:0 8px;
  border-radius:999px;
  font-size:9px;
  font-weight:700;
  color:var(--success);
  background:#eef8f4;
}
.balanceHeroStatus.debt{
  color:var(--danger);
  background:#fff1f2;
}

.balanceHeroAmount{
  margin-top:7px;
  font-size:34px;
  line-height:1.05;
  font-weight:880;
  letter-spacing:-.9px;
  color:var(--navy);
  white-space:nowrap;
}
.balanceHeroAmount.negative{
  color:var(--danger);
}

.balanceHeroHint{
  margin-top:7px;
  font-size:10px;
  line-height:1.45;
  color:var(--muted);
}

/* 次要数据做成一条简洁信息带 */
.accountSubStats{
  display:grid;
  grid-template-columns:1fr 1fr;
  border-top:1px solid var(--line);
  background:#fbfcfe;
}

.subStat{
  min-width:0;
  padding:11px 16px 12px;
}

.subStat + .subStat{
  border-left:1px solid var(--line);
}

.subStatLabel{
  font-size:10px;
  color:var(--muted);
  line-height:1.3;
}

.subStatValue{
  margin-top:4px;
  font-size:16px;
  line-height:1.25;
  font-weight:780;
  color:var(--text);
  white-space:nowrap;
}

.subStatValue.usage{
  font-size:18px;
  color:var(--navy);
}

.subStatValue .unit{
  margin-left:3px;
  font-size:10px;
  font-weight:600;
  color:var(--muted);
}

.subStatHint{
  margin-top:3px;
  font-size:9px;
  line-height:1.35;
  color:var(--muted);
}

/* 操作区保持现有 2x2，只改善与数据区的衔接 */
.accountActionGrid{
  padding:11px 14px 15px;
  border-top:1px solid var(--line);
  background:#fff;
}


/* ===== 最终定稿修正版：缴费金额交互 ===== */
.moneyGrid.payFive{
  grid-template-columns:repeat(5,1fr);
  gap:7px;
}
.moneyGrid.payFive .moneyOption{
  font-size:12px;
}
.customPayField{
  margin-top:12px;
}
.customPayField.hidden{
  display:none;
}


/* ===== 内容优化版：常用服务删减为3项 ===== */
.quickGrid{
  grid-template-columns:repeat(3,1fr);
}

.videoFloatHead b{
  font-size:15px;

}
.videoCloseBtn{

}
.videoStage{

.videoStageCenter{

.videoPlayMain{

.videoStageTitle{
  font-size:15px;

}
.videoStageDesc{
  margin-top:5px;

}
.videoControls{
  padding:11px 13px 13px;
  background:#101720;

}
.videoControlRow{
  display:flex;

}
.videoMiniPlay{

.videoProgress{

.videoFloatFoot{

}
.bindCaptchaHead b{
  font-size:13px;

}
.bindCaptchaHead span{
  font-size:10px;

}
.puzzleScene{

}

  background:#82cfa7;
  transform:rotate(-3deg);
}
.puzzleScene:after{
  content:"";
  position:absolute;
  left:20%;
  bottom:20px;

  background:rgba(62,139,112,.18);
  transform:rotate(7deg);
}

  position:absolute;
  inset:0;
  pointer-events:none;
}
.puzzleDecor .cloud1,
.puzzleDecor .cloud2{
  position:absolute;
  height:13px;
  border-radius:20px;
  background:rgba(255,255,255,.72);
}
.puzzleDecor .cloud1{width:52px;left:20px;top:20px}
.puzzleDecor .cloud2{width:38px;left:88px;top:38px;opacity:.68}
.puzzleDecor .water{
  position:absolute;
  right:-14px;

  width:155px;
  height:46px;
  border-radius:60% 0 0 0;
  background:rgba(63,163,224,.44);
}
.puzzleTarget,
.puzzlePiece{

.puzzleTarget{
  left:72%;
  z-index:3;

  height:14px;

  background:inherit;
  border-right:2px solid rgba(255,255,255,.96);
}
.captchaSlider{
  position:relative;
  height:44px;
  margin-top:10px;
  border-radius:12px;
  background:#eef2f6;
  border:1px solid #e0e6ed;
  overflow:hidden;
  user-select:none;
  touch-action:none;
}
.captchaFill{
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:0;
  background:linear-gradient(90deg,#dceeff,#c7e3ff);
  transition:background .18s;
}

  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding-left:42px;
  font-size:11px;
  color:#758195;
  pointer-events:none;
}
.captchaKnob{
  position:absolute;
  left:0;
  top:0;
  width:44px;
  height:44px;
  border:0;
  border-right:1px solid #d6e2ef;
  background:#fff;

  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:2px 0 8px rgba(40,80,120,.08);

}
.captchaKnob:active{cursor:grabbing}
.bindCaptcha.success{

}
.bindCaptcha.success .captchaSlider{
  border-color:#a8dec6;
  background:#ebf8f2;
}
.bindCaptcha.success .captchaFill{
  background:#d8f3e7;
}
.bindCaptcha.success .captchaKnob{
  color:#149568;

}
.bindCaptcha.success .captchaSliderText{
  color:#13865f;
  font-weight:700;
}
.bindCaptcha.error .captchaSlider{
  border-color:#f0bec3;
  background:#fff5f6;
}
.bindCaptcha.error .captchaSliderText{
  color:#d34a56;
}
.bindCaptchaStatus{
  min-height:17px;
  margin-top:7px;
  font-size:10px;
  color:var(--muted);
}
.bindCaptcha.success .bindCaptchaStatus{
  color:#13865f;
}
.bindCaptcha.error .bindCaptchaStatus{
  color:#d34a56;
}

}
.bindCaptcha.error .captchaAttempt{
  color:#d34a56;
}

let guideVideoPlaying=false;
let guideVideoSeconds=0;
let guideVideoTimer=null;
const GUIDE_VIDEO_DURATION=150;

function formatGuideTime(sec){
  sec=Math.max(0,Math.min(GUIDE_VIDEO_DURATION,Number(sec)||0));
  const m=Math.floor(sec/60);
  const s=Math.floor(sec%60);
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function updateGuideVideoUi(){
  const stage=document.getElementById('videoStage');
  const mini=document.getElementById('videoMiniPlay');
  const main=document.getElementById('videoPlayMain');
  const bar=document.getElementById('videoProgressInner');
  const time=document.getElementById('videoTime');

  if(stage)stage.classList.toggle('playing',guideVideoPlaying);
  if(mini)mini.textContent=guideVideoPlaying?'❚❚':'▶';
  if(main)main.textContent=guideVideoPlaying?'❚❚':'▶';
  if(bar)bar.style.width=`${Math.min(100,guideVideoSeconds/GUIDE_VIDEO_DURATION*100)}%`;
  if(time)time.textContent=`${formatGuideTime(guideVideoSeconds)} / ${formatGuideTime(GUIDE_VIDEO_DURATION)}`;
}

function showGuideVideo(){
  hideModal();
  const mask=document.getElementById('videoFloatMask');
  if(!mask)return;
  mask.classList.add('show');
  updateGuideVideoUi();
}

function closeGuideVideo(){
  const mask=document.getElementById('videoFloatMask');
  if(mask)mask.classList.remove('show');
  guideVideoPlaying=false;
  if(guideVideoTimer){
    clearInterval(guideVideoTimer);
    guideVideoTimer=null;
  }
  updateGuideVideoUi();
}

function toggleGuideVideo(){
  guideVideoPlaying=!guideVideoPlaying;

  if(guideVideoPlaying){
    if(guideVideoSeconds>=GUIDE_VIDEO_DURATION)guideVideoSeconds=0;
    if(guideVideoTimer)clearInterval(guideVideoTimer);

    guideVideoTimer=setInterval(()=>{
      guideVideoSeconds++;
      if(guideVideoSeconds>=GUIDE_VIDEO_DURATION){
        guideVideoSeconds=GUIDE_VIDEO_DURATION;
        guideVideoPlaying=false;
        clearInterval(guideVideoTimer);
        guideVideoTimer=null;
      }
      updateGuideVideoUi();
    },1000);
  }else if(guideVideoTimer){
    clearInterval(guideVideoTimer);
    guideVideoTimer=null;
  }

  updateGuideVideoUi();
}

  if(a.balance<=0){

  }

  if(a.valveCommandStatus==='applied'){
    toast('开阀已申请，无需重复操作');
    return;
  }

  showModal(`<div class="sheetBar"></div>
  <h3>开阀确认</h3>

function submitOpenValve(id){
  const a=state.accounts.find(x=>x.id===id);
  if(!a)return;

  if(a.balance<=0){
    hideModal();
    toast('当前余额不足，无法申请开阀');
    return;
  }

  if(a.valveCommandStatus==='applied'){

  a.valveCommandStatus='applied';

function applyCaptchaTheme(){
  const scene=document.getElementById('puzzleScene');
  if(!scene)return;

  const themes=[
    {
      bg:'radial-gradient(circle at 76% 22%, rgba(255,255,255,.90) 0 10px, transparent 11px), linear-gradient(180deg,#8ed5ff 0%,#b9e6ff 50%,#dff4ff 51%,#c7ead8 100%)'
    },
    {
      bg:'radial-gradient(circle at 24% 18%, rgba(255,247,209,.90) 0 11px, transparent 12px), linear-gradient(180deg,#9dc9ff 0%,#c7ddff 48%,#e7f3ff 49%,#d8e2b7 100%)'
    },
    {
      bg:'radial-gradient(circle at 70% 16%, rgba(255,255,255,.88) 0 9px, transparent 10px), linear-gradient(180deg,#9fe1ea 0%,#c3edf1 48%,#e7f7f7 49%,#bcdcb5 100%)'
    },
    {
      bg:'radial-gradient(circle at 32% 20%, rgba(255,242,184,.92) 0 10px, transparent 11px), linear-gradient(180deg,#a7c8f1 0%,#c9dcf5 46%,#e7f0f7 47%,#cfd8aa 100%)'
    }
  ];

  bindCaptchaThemeIndex=(bindCaptchaThemeIndex+1)%themes.length;
  scene.style.background=themes[bindCaptchaThemeIndex].bg;
}

function updateCaptchaAttemptText(){
  const el=document.getElementById('captchaAttempt');
  if(!el)return;
  if(bindCaptchaVerified){
    el.textContent='验证通过';
    return;
  }
  const remain=Math.max(0,3-bindCaptchaFailCount);
  el.textContent=`剩余 ${remain} 次`;
}

function initBindCaptcha(){
  const box=document.getElementById('bindCaptcha');
  const scene=document.getElementById('puzzleScene');
  const target=document.getElementById('puzzleTarget');
  const piece=document.getElementById('puzzlePiece');
  const slider=document.getElementById('captchaSlider');
  const knob=document.getElementById('captchaKnob');

  if(!box||!scene||!target||!piece||!slider||!knob)return;

  bindCaptchaVerified=false;
  bindCaptchaDragging=false;
  bindCaptchaFailCount=0;

  applyCaptchaTheme();

  const usable=Math.max(120,scene.clientWidth-62);
  bindCaptchaTargetLeft=Math.round(usable*(0.52+Math.random()*0.28));
  target.style.left=`${bindCaptchaTargetLeft}px`;
  piece.style.left=`${bindCaptchaPieceStart}px`;

  resetBindCaptchaVisual(false);

  knob.addEventListener('pointerdown',startBindCaptchaDrag);
  knob.addEventListener('pointermove',moveBindCaptchaDrag);
  knob.addEventListener('pointerup',endBindCaptchaDrag);
  knob.addEventListener('pointercancel',endBindCaptchaDrag);

  updateCaptchaAttemptText();
  updateBindButton();
}

function refreshBindCaptcha(manual=false){
  const scene=document.getElementById('puzzleScene');
  const target=document.getElementById('puzzleTarget');
  if(!scene||!target)return;

  bindCaptchaVerified=false;
  bindCaptchaDragging=false;
  bindCaptchaFailCount=0;

  applyCaptchaTheme();

  const usable=Math.max(120,scene.clientWidth-62);
  bindCaptchaTargetLeft=Math.round(usable*(0.52+Math.random()*0.28));
  target.style.left=`${bindCaptchaTargetLeft}px`;

  resetBindCaptchaVisual(false);

  const status=document.getElementById('bindCaptchaStatus');
  if(status){
    status.textContent=manual
      ?'已刷新验证码，请重新拖动完成验证'
      :'已为你更换新的验证码，请重新验证';
  }

  updateCaptchaAttemptText();
  updateBindButton();
}

function resetBindCaptchaVisual(showHint=true){
  const box=document.getElementById('bindCaptcha');
  const piece=document.getElementById('puzzlePiece');
  const knob=document.getElementById('captchaKnob');
  const fill=document.getElementById('captchaFill');
  const text=document.getElementById('captchaSliderText');
  const status=document.getElementById('bindCaptchaStatus');

  if(!box||!piece||!knob||!fill||!text||!status)return;

  box.classList.remove('success','error');
  piece.style.left=`${bindCaptchaPieceStart}px`;
  knob.style.left='0px';
  fill.style.width='0px';
  knob.textContent='→';
  text.textContent='按住滑块，拖动拼图到缺口位置';

  if(showHint){
    box.classList.add('error');
    status.textContent='验证失败，请重新拖动';
    setTimeout(()=>box.classList.remove('error'),650);
  }else{
    status.textContent='完成验证后才可查询并绑定用水户';
  }
}

function startBindCaptchaDrag(e){
  if(bindCaptchaVerified)return;
  const knob=document.getElementById('captchaKnob');
  if(!knob)return;

  bindCaptchaDragging=true;
  bindCaptchaStartX=e.clientX;
  bindCaptchaStartLeft=parseFloat(knob.style.left||'0')||0;

  try{knob.setPointerCapture(e.pointerId)}catch(_){}
}

function moveBindCaptchaDrag(e){
  if(!bindCaptchaDragging||bindCaptchaVerified)return;

  const scene=document.getElementById('puzzleScene');
  const piece=document.getElementById('puzzlePiece');
  const slider=document.getElementById('captchaSlider');
  const knob=document.getElementById('captchaKnob');
  const fill=document.getElementById('captchaFill');

  if(!scene||!piece||!slider||!knob||!fill)return;

  const maxKnob=Math.max(1,slider.clientWidth-knob.offsetWidth);
  const dx=e.clientX-bindCaptchaStartX;
  const left=Math.max(0,Math.min(maxKnob,bindCaptchaStartLeft+dx));
  knob.style.left=`${left}px`;
  fill.style.width=`${left+knob.offsetWidth/2}px`;

  const ratio=left/maxKnob;
  const maxPiece=Math.max(bindCaptchaPieceStart,scene.clientWidth-piece.offsetWidth-10);
  const pieceLeft=bindCaptchaPieceStart+ratio*(maxPiece-bindCaptchaPieceStart);
  piece.style.left=`${pieceLeft}px`;
}

function endBindCaptchaDrag(e){
  if(!bindCaptchaDragging||bindCaptchaVerified)return;
  bindCaptchaDragging=false;

  const piece=document.getElementById('puzzlePiece');
  const slider=document.getElementById('captchaSlider');
  const knob=document.getElementById('captchaKnob');
  const fill=document.getElementById('captchaFill');
  const box=document.getElementById('bindCaptcha');
  const text=document.getElementById('captchaSliderText');
  const status=document.getElementById('bindCaptchaStatus');

  if(!piece||!slider||!knob||!fill||!box||!text||!status)return;

  const pieceLeft=parseFloat(piece.style.left||'0');
  const diff=Math.abs(pieceLeft-bindCaptchaTargetLeft);

  if(diff<=9){
    bindCaptchaVerified=true;
    piece.style.left=`${bindCaptchaTargetLeft}px`;

    const scene=document.getElementById('puzzleScene');
    const maxPiece=Math.max(bindCaptchaPieceStart,scene.clientWidth-piece.offsetWidth-10);
    const ratio=(bindCaptchaTargetLeft-bindCaptchaPieceStart)/(maxPiece-bindCaptchaPieceStart);
    const maxKnob=Math.max(1,slider.clientWidth-knob.offsetWidth);
    const knobLeft=Math.max(0,Math.min(maxKnob,ratio*maxKnob));

    knob.style.left=`${knobLeft}px`;
    fill.style.width=`${knobLeft+knob.offsetWidth/2}px`;
    knob.textContent='✓';

    box.classList.remove('error');
    box.classList.add('success');
    text.textContent='验证通过';
    status.textContent='图形验证成功，可以查询用户';

    updateCaptchaAttemptText();
    updateBindButton();
  }else{
    bindCaptchaVerified=false;
    bindCaptchaFailCount++;

    if(bindCaptchaFailCount>=3){
      resetBindCaptchaVisual(false);
      refreshBindCaptcha(false);
      toast('多次验证失败，已为你刷新验证码');
    }else{
      resetBindCaptchaVisual(true);
      updateCaptchaAttemptText();
      updateBindButton();
    }
  }
}

function switchBindTab(t){bindCaptchaVerified=false;state.bindingTab=t;persist();render()}
function updateBindButton(){
  const btn=document.getElementById('bindQueryBtn');
  if(!btn)return;

  let fieldsReady=false;

  if(state.bindingTab==='meter'){
    const meter=document.getElementById('meterNo');
    fieldsReady=!!(meter && meter.value.trim());
  }else{
    const vals=['userName','userNo','mobile']
      .map(id=>document.getElementById(id)?.value.trim()||'')
      .filter(Boolean);

    fieldsReady=vals.length>=2;

    const c=document.getElementById('bindCounter');
    if(c){
      c.textContent=`已填写 ${Math.min(vals.length,2)}/2 项${vals.length>=2?'，信息填写完成':''}`;
      c.className='bindCounter '+(vals.length>=2?'ok':'');
    }
  }

  btn.disabled=!(fieldsReady && bindCaptchaVerified);

  if(fieldsReady && !bindCaptchaVerified){
    btn.textContent='请先完成图形验证';
  }else{
    btn.textContent='查询用户';
  }
}
function queryBinding(){
  if(!bindCaptchaVerified){
    toast('请先完成图形拖动验证');
    return;
  }

  const all=[...demoAccounts,...candidatePool];
  let result=null;

  if(state.bindingTab==='meter'){
    const meterNo=document.getElementById('meterNo').value.trim();
    if(!meterNo)return;

    result=all.find(x=>String(x.meterNo||'').trim()===meterNo) || null;
  }else{
    const userName=document.getElementById('userName').value.trim();
    const userNo=document.getElementById('userNo').value.trim();
    const mobile=document.getElementById('mobile').value.trim();

    const conditions=[
      userName ? (x=>String(x.name||'').trim()===userName) : null,
      userNo ? (x=>String(x.userNo||'').trim()===userNo) : null,
      mobile ? (x=>String(x.mobileFull||x.mobile||'').trim()===mobile) : null
    ].filter(Boolean);

    if(conditions.length<2){
      toast('请至少填写两项用户信息');
      return;
    }

    // 精准 AND 匹配：填写的所有条件必须同时命中同一户
    result=all.find(x=>conditions.every(fn=>fn(x))) || null;
  }

  if(!result){
    state.queryResults=[];
    state.selectedCandidate=null;
    persist();
    toast('未查询到匹配的用水户');
    return;
  }

  state.queryResults=[JSON.parse(JSON.stringify(result))];
  state.selectedCandidate=result.id;
  bindCaptchaVerified=false;
  persist();
  nav('bindConfirm');
}
function selectedCandidate(){
  return (state.queryResults||[]).find(x=>x.id===state.selectedCandidate) || null;
}

function renderBindConfirm(){
  const x=selectedCandidate();if(!x)return renderBind();
  return `<section class="screen noTab">${pageTop('确认绑定')}<div class="content"><div class="infoBanner"><div class="top"><b>请确认用户信息</b><span class="badge ok">信息匹配</span></div><p>确认后该用水户将加入你的“户表管理”，可直接查询余额并发起微信缴费。</p></div><div class="summaryCard"><div class="sumRow"><span>用户名称</span><b>${esc(x.name)}</b></div><div class="sumRow"><span>用户编号</span><b>${esc(x.userNo)}</b></div><div class="sumRow"><span>手机号码</span><b>${esc(x.mobileFull || x.mobile)}</b></div><div class="sumRow"><span>表具编号</span><b>${esc(x.meterNo)}</b></div><div class="sumRow"><span>用水地址</span><b>${esc(x.address)}</b></div><div class="sumRow"><span>用水性质</span><b>${esc(x.waterType||'居民生活用水')}</b></div></div><button class="primaryBtn fullBtn" onclick="confirmBinding()">确认绑定</button><button class="softBtn fullBtn" onclick="back()">返回修改</button></div></section>`

function confirmBinding(){
  const x=selectedCandidate();if(!x)return;if(state.accounts.some(a=>a.userNo===x.userNo||a.meterNo===x.meterNo)){toast('该用水户已绑定，无需重复操作');return}

function chooseAmount(n){
  state.payCustom=false;
  state.customPayText='';
  state.payAmount=Math.round(Number(n)*100)/100;
  persist();
  render();
}

function enableCustomAmount(){
  state.payCustom=true;
  state.customPayText='';
  state.payAmount=null;
  persist();
  render();
  setTimeout(()=>document.getElementById('customAmount')?.focus(),0);
}

function customAmountChanged(v){
  v=(v||'').replace(/[^0-9.]/g,'').replace(/(\..*)\./g,'$1');
  if(v.includes('.')){
    const parts=v.split('.');
    v=parts[0]+'.'+parts[1].slice(0,2);
  }
  state.customPayText=v;

  const n=Number(v);
  state.payAmount=(n>0&&n<=99999)?Math.round(n*100)/100:null;
  persist();

  renderPayDynamic();
}

function renderPayDynamic(){
  const n=Number(state.payAmount||0);
  const x=payAccount();

  const btn=[...document.querySelectorAll('.primaryBtn')].find(
    b=>b.textContent.trim().startsWith('确认缴费')
  );
  if(btn){
    btn.disabled=!(n>0&&state.agreement);
    btn.textContent=`确认缴费 ¥ ${n>0?money(n):'0.00'}`;
  }

  const predict=document.getElementById('payPredict');
  const value=document.getElementById('payPredictValue');
  if(predict&&value&&x){
    if(n>0){
      predict.style.display='';
      value.textContent=`¥ ${money(x.balance+n)}`;
    }else{
      predict.style.display='none';
    }
  }
}

function toggleAgreement(v){state.agreement=v;persist();renderPayDynamic()}

  const after=x.balance+amt;showModal(`<div class="sheetBar"></div><h3>确认微信缴费</h3><div class="summaryCard"><div class="sumRow"><span>缴费户号</span><b>${esc(x.userNo)}</b></div><div class="sumRow"><span>用水地址</span><b>${esc(x.address)}</b></div><div class="sumRow"><span>当前余额</span><b>¥ ${money(x.balance)}</b></div><div class="sumRow"><span>缴费金额</span><b class="brandText">¥ ${money(amt)}</b></div><div class="sumRow"><span>预计缴费后余额</span><b>¥ ${money(after)}</b></div></div><p>确认后将创建缴费订单并拉起微信支付。</p><div class="modalActions"><button class="softBtn" onclick="hideModal()">取消</button><button class="primaryBtn" onclick="showWxSimulator()">确认支付</button></div>`)
}
function showWxSimulator(){showModal(`<div class="sheetBar"></div><h3>微信支付 · 原型模拟</h3><p>正式开发时此处对接微信支付能力，并以后端查单结果更新订单状态。为了完整验证页面，原型保留四种结果分支：</p><div class="simGrid"><button onclick="finishPayment('success')">支付成功</button><button onclick="finishPayment('processing')">结果确认中</button><button onclick="finishPayment('failed')">支付失败</button><button onclick="finishPayment('cancelled')">用户取消</button></div>`)}
function finishPayment(type){
  const x=payAccount();if(!x)return;const before=x.balance;const amt=Number(state.payAmount||0);if(type==='success'){x.balance=Math.round((x.balance+amt)*100)/100;x.records=x.records||[];x.records.unshift({time:new Date().toLocaleString('zh-CN',{hour12:false}).replaceAll('/','-'),amount:amt,status:'成功',channel:'微信支付',txn:'WX'+Date.now()})}
  state.paymentResult={type,before,amount:amt,after:type==='success'?x.balance:before,time:new Date().toLocaleString('zh-CN',{hour12:false}),txn:'WX'+Date.now()};persist();hideModal();nav('paymentResult')
}
function renderPaymentResult(){
  const r=state.paymentResult,x=payAccount();if(!r||!x)return renderHome();const m={success:['ok',icon('check',36),'缴费成功','款项已确认，账户余额已更新。'],processing:['wait',icon('clock',34),'支付结果确认中','订单正在确认，请勿重复缴费。'],failed:['fail',icon('x',34),'支付失败','本次支付未完成，可返回重新支付。'],cancelled:['cancel',icon('x',34),'支付已取消','你已取消本次微信支付。']}[r.type];
  return `<section class="screen noTab">${pageTop('缴费结果')}<div class="resultPage"><div class="resultIcon ${m[0]}">${m[1]}</div><h2>${m[2]}</h2><p>${m[3]}</p><div class="summaryCard"><div class="sumRow"><span>用户编号</span><b>${esc(x.userNo)}</b></div><div class="sumRow"><span>缴费金额</span><b>¥ ${money(r.amount)}</b></div><div class="sumRow"><span>缴费前余额</span><b>¥ ${money(r.before)}</b></div>${r.type==='success'?`<div class="sumRow"><span>缴费后余额</span><b class="brandText">¥ ${money(r.after)}</b></div>`:''}<div class="sumRow"><span>支付时间</span><b>${esc(r.time)}</b></div>${r.type==='success'?`<div class="sumRow"><span>交易流水号</span><b style="font-size:11px">${esc(r.txn)}</b></div>`:''}</div>${r.type==='processing'?`<button class="primaryBtn fullBtn" onclick="recheckPayment()">刷新支付结果</button>`:(r.type==='failed'||r.type==='cancelled')?`<button class="primaryBtn fullBtn" onclick="nav('pay')">重新支付</button>`:''}<button class="softBtn fullBtn" onclick="finishToHome()">返回首页</button></div></section>`
}
function recheckPayment(){toast('正在查询微信订单状态…');setTimeout(()=>finishPayment('success'),650)}
function finishToHome(){state.history=[];state.screen='home';state.payAmount=null;state.paymentResult=null;persist();render()}


function buildSixMonthUsage(x){
  const now=new Date();
  const billMap=new Map();

  (x.bills||[]).forEach(b=>{
    const monthNum=parseInt(String(b.month||'').replace(/[^0-9]/g,''),10);
    if(!Number.isFinite(monthNum))return;
    const key=`${Number(b.year)}-${String(monthNum).padStart(2,'0')}`;
    billMap.set(key,Number(b.usage||0));
  });

  const result=[];
  for(let offset=5;offset>=0;offset--){
    const d=new Date(now.getFullYear(),now.getMonth()-offset,1);
    const year=d.getFullYear();
    const month=d.getMonth()+1;
    const key=`${year}-${String(month).padStart(2,'0')}`;

    let usage=billMap.has(key)?Number(billMap.get(key)||0):0;
    if(offset===0){
      usage=Number(x.monthlyUsage||0);
    }

    result.push({
      year,
      month,
      label:`${month}月`,
      usage
    });
  }
  return result;
}

function renderUsage(){
  const x=currentAccount();
  if(!x)return renderEmptyRedirect('用量查询');

  const monthly=buildSixMonthUsage(x);
  const max=Math.max(...monthly.map(i=>i.usage),1);

  return `<section class="screen noTab">${pageTop('用量查询',{label:'切换户表',action:"nav('manage')"})}
    <div class="content">
      <div class="infoBanner">
        <div class="top"><b>${esc(x.name)} · ${esc(x.meterNo)}</b><span class="badge">当前户表</span></div>
        <p>${esc(x.address)}</p>
      </div>

      <div class="usageTop">
        <small>本月累计用水</small>
        <div class="big">${money(x.monthlyUsage)} <small>m³</small></div>
        <p>当前上数时间：${esc(x.readTime)}</p>

        <div class="bars">
          ${monthly.map(r=>`
            <div class="barCol" title="${r.year}年${r.month}月：${money(r.usage)} m³">
              <div class="bar" style="height:${r.usage>0?Math.max(10,Math.round(r.usage/max*78)):8}px"></div>
              <span>${r.label}</span>
            </div>
          `).join('')}
        </div>
      </div>

      <div class="sectionCard">
        <div class="sectionHeader">
          <div>
            <div class="sectionTitle">抄表明细</div>
            <div class="sectionSub">展示每月抄表时间及抄表用量</div>
          </div>
        </div>
        <div class="readingRow header"><span>抄表时间</span><span>本次读数</span><span>本次用量</span></div>
        ${(x.usage&&x.usage.length?x.usage:[{time:'暂无记录',read:x.read,use:0}]).map(r=>`
          <div class="readingRow">
            <b>${esc(r.time)}</b>
            <span>${money(r.read)}</span>
            <span>${money(r.use)} m³</span>
          </div>
        `).join('')}
      </div>
    </div>
  </section>`
}
function groupRecords(records){const g={};records.forEach(r=>{const m=r.time.slice(0,7);(g[m]||(g[m]=[])).push(r)});return g}
function renderRecords(){
  const x=currentAccount();if(!x)return renderEmptyRedirect('缴费记录');const records=x.records||[];const groups=groupRecords(records);
  return `<section class="screen noTab">${pageTop('缴费记录',{label:'切换户表',action:"nav('manage')"})}<div class="content"><div class="infoBanner"><div class="top"><b>${esc(x.name)} · ${esc(x.userNo)}</b><span class="badge ok">微信支付</span></div><p>展示该户号在移动端完成的微信缴费记录。</p></div>${records.length?Object.keys(groups).sort().reverse().map(month=>`<div class="recordMonth">${month}</div>${groups[month].map(r=>`<div class="recordItem"><div class="recordIcon">${icon('wallet',20)}</div><div class="recordMain"><b>${esc(r.channel)}</b><small>${esc(r.time)}<br>${esc(r.txn)}</small></div><div class="recordAmount"><b>+¥${money(r.amount)}</b><small>${esc(r.status)}</small></div></div>`).join('')}`).join(''):`<div class="empty"><div class="emptyIcon">${icon('list',32)}</div><h2>暂无缴费记录</h2><p>完成微信缴费后，交易记录会展示在这里。</p></div>`}</div></section>`
}
function renderBills(){
  const x=currentAccount();if(!x)return renderEmptyRedirect('周期账单');const currentYear=new Date().getFullYear();const years=[currentYear,currentYear-1,currentYear-2];const bills=(x.bills||[]).filter(b=>b.year===state.billYear);
  return `<section class="screen noTab">${pageTop('周期账单',{label:'切换户表',action:"nav('manage')"})}<div class="content"><div class="infoBanner"><div class="top"><b>${esc(x.name)} · ${esc(x.userNo)}</b><span class="badge">历史账单</span></div><p>${esc(x.address)}</p></div><div class="yearTabs">${years.map(y=>`<button class="yearBtn ${state.billYear===y?'active':''}" onclick="setBillYear(${y})">${y}年度</button>`).join('')}</div>${bills.length?bills.map(b=>`<div class="billItem"><div class="billTop"><b>${b.month}</b><span class="badge ${b.status==='待缴'?'red':'ok'}">${b.status}</span></div><div class="billMetrics"><div class="billMetric"><span>本期水量</span><b>${money(b.usage)} <small style="font-size:10px;color:var(--muted)">m³</small></b></div><div class="billMetric"><span>本期消费</span><b>¥ ${money(b.amount)}</b></div></div></div>`).join(''):`<div class="empty"><div class="emptyIcon">${icon('calendar',32)}</div><h2>${state.billYear} 年暂无账单</h2><p>当前年度暂未查询到周期账单数据。</p></div>`}</div></section>`
}
function setBillYear(y){state.billYear=y;persist();render()}

function showModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modalMask').classList.add('show')}
function hideModal(){document.getElementById('modalMask').classList.remove('show')}
document.getElementById('modalMask').addEventListener('click',e=>{if(e.target.id==='modalMask')hideModal()});
document.getElementById('videoFloatMask').addEventListener('click',e=>{
  if(e.target.id==='videoFloatMask')closeGuideVideo();
});
render();
</script>
